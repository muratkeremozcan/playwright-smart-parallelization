# Every gate the repository defines runs here: lint, format, unit tests, the dist check and the
# public-repo check. The `e2e` jobs run the Action from this checkout on the consumer fixture, each
# a shard matrix whose jobs run the Action and their own Playwright command with $PSP_ARGS, and the
# finish action after them, against this repository's own Actions cache.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The finish action reads the jobs API to measure the per-shard overhead in its summary.
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, format, unit tests, public check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/consumer/package-lock.json

      # The same setup as docs/development.md: the root and the consumer fixture the unit tests list
      # and run with its real Playwright.
      - name: Install dependencies
        run: npm run setup

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Public repo check
        run: npm run check:public

  # Every leg has its own history key, keyed on the run id so a re-run finds it again. The legs
  # run only where the Action's trust rule lets them write: never for a fork pull request.
  e2e-cold-warm:
    name: e2e, cold start, then a warm run with no finish between
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-cold-warm-${{ github.run_id }}
      warm: true
      expect-mode: native
      expect-history: published

  e2e-eight:
    name: e2e, eight shards publishing at once
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-eight-${{ github.run_id }}
      shards: 8
      barrier: true
      expect-mode: native
      expect-history: published

  e2e-race:
    name: e2e, eight shards pinning at once while the history moves
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-race-${{ github.run_id }}
      shards: 8
      seed: true
      start-together: true
      expect-mode: balanced
      expect-history: published

  e2e-rerun:
    name: e2e, balanced, and a re-run shard reads the same pin
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-rerun-${{ github.run_id }}
      seed: true
      rerun: true
      expect-mode: balanced
      expect-history: published

  e2e-failed:
    name: e2e, a failing test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-failed-${{ github.run_id }}
      seed: true
      fail-test: adds an item
      expect-mode: balanced
      expect-finish: failure
      expect-history: published

  e2e-disabled:
    name: e2e, disabled by Yarn Plug'n'Play
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-disabled-${{ github.run_id }}
      seed: true
      pnp: true
      expect-mode: disabled
      expect-exactly-once: not checked
      expect-history: unchanged

  # The workers are Playwright's in both legs: the first job plans for the seeded count and runs
  # with its own, and the warm job plans for the count the first job's shards published.
  e2e-workers-config:
    name: e2e, workers set only in the Playwright config
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-workers-config-${{ github.run_id }}
      playwright-args: --config=workers.config.js
      expect-workers: '3'
      seed: true
      warm: true
      expect-mode: balanced
      expect-history: published

  e2e-workers-cli:
    name: e2e, --workers on the command line
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-workers-cli-${{ github.run_id }}
      playwright-args: --workers=3
      expect-workers: '3'
      seed: true
      warm: true
      expect-mode: balanced
      expect-history: published

  e2e-shell:
    name: e2e, shell variables and --grep "$FILTER", no working-directory
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-shell-${{ github.run_id }}
      shards: 2
      shape: shell
      working-directory: ''
      seed: true
      expect-mode: balanced
      expect-history: published

  e2e-npm:
    name: e2e, an npm script
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-npm-${{ github.run_id }}
      shape: npm
      seed: true
      expect-mode: balanced
      expect-history: published

  e2e-pr-head:
    name: e2e, a pull request that checks out its head commit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-pr-head-${{ github.run_id }}
      checkout-head: true
      seed: true
      expect-mode: balanced
      expect-history: published

  # Each harness run is independent and spends most of its time in the fixture's serial sleeps, so
  # the runs are matrix legs that execute in parallel. A leg fails on any violation, and the
  # negative legs also fail when a control does not behave as expected.
  harness:
    name: qualification harness, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native sharding, 2 shards
            id: native-2
            command: npm run harness -- --shards 2 --report harness-report.json
          - name: native sharding, 3 shards
            id: native-3
            command: npm run harness -- --shards 3 --report harness-report.json
          - name: native sharding, 3 shards with repeat-each 2
            id: native-3-repeat
            command: npm run harness -- --shards 3 --repeat-each 2 --report harness-report.json
          - name: native sharding, setup project selected by name
            id: native-setup
            command: npm run harness -- --shards 2 --report harness-report.json -- --project=setup
          - name: native sharding, identity fixture
            id: native-identity
            command: npm run harness -- --shards 2 --config identity.config.js --report harness-report.json
          - name: negative control
            id: negative
            command: npm run harness:negative -- --report harness-report.json
          - name: negative control with repeat-each 2
            id: negative-repeat
            command: npm run harness:negative -- --repeat-each 2 --report harness-report.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json

      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci

      - name: Run the harness
        run: ${{ matrix.command }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ matrix.id }}
          path: harness-report.json
          if-no-files-found: ignore
