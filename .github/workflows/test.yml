# Every gate the repository defines runs here: lint, format, unit tests and the public-repo check.
# The `stub` job runs the action itself, which proves a consuming workflow sees a failed step. It
# checks the outcome only: the not-implemented message is asserted by the unit tests, which execute
# action.yml's run line, so a broken run line cannot hide behind this job's failure check.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, format, unit tests, public check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/consumer/package-lock.json
            qualification/flakiness/package-lock.json

      # The same setup as docs/development.md: the root, the consumer fixture the unit tests list
      # and run with its real Playwright, and the Flakiness package its unit tests run.
      - name: Install dependencies
        run: npm run setup

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Public repo check
        run: npm run check:public

  stub:
    name: the action fails when used
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the action
        id: action
        uses: ./
        continue-on-error: true

      - name: Require the failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Expected the stub action to fail, got outcome $OUTCOME." >&2
            exit 1
          fi

  # Each harness run is independent and spends most of its time in the fixture's serial sleeps, so
  # the runs are matrix legs that execute in parallel. A leg fails on any violation, and the
  # negative legs also fail when a control does not behave as expected.
  harness:
    name: qualification harness, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native sharding, 2 shards
            id: native-2
            command: npm run harness -- --shards 2 --report harness-report.json
          - name: native sharding, 3 shards
            id: native-3
            command: npm run harness -- --shards 3 --report harness-report.json
          - name: native sharding, 3 shards with repeat-each 2
            id: native-3-repeat
            command: npm run harness -- --shards 3 --repeat-each 2 --report harness-report.json
          - name: native sharding, setup project selected by name
            id: native-setup
            command: npm run harness -- --shards 2 --report harness-report.json -- --project=setup
          - name: native sharding, identity fixture
            id: native-identity
            command: npm run harness -- --shards 2 --config identity.config.js --report harness-report.json
          - name: negative control
            id: negative
            command: npm run harness:negative -- --report harness-report.json
          - name: negative control with repeat-each 2
            id: negative-repeat
            command: npm run harness:negative -- --repeat-each 2 --report harness-report.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json

      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci

      - name: Run the harness
        run: ${{ matrix.command }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ matrix.id }}
          path: harness-report.json
          if-no-files-found: ignore
