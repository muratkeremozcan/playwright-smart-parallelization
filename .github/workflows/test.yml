# Every gate the repository defines runs here: lint, format, unit tests and the public-repo check.
# The `stub` job runs the action itself, which proves a consuming workflow sees a failed step. It
# checks the outcome only: the not-implemented message is asserted by the unit tests, which execute
# action.yml's run line, so a broken run line cannot hide behind this job's failure check.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, format, unit tests, public check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Public repo check
        run: npm run check:public

  stub:
    name: the action fails when used
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the action
        id: action
        uses: ./
        continue-on-error: true

      - name: Require the failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Expected the stub action to fail, got outcome $OUTCOME." >&2
            exit 1
          fi
