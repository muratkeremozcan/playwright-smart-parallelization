# Every gate the repository defines runs here: lint, format, unit tests and the public-repo check.
# The `e2e` jobs run the Action from this checkout on the consumer fixture, each a full pipeline of
# prepare, a three-shard matrix and finish against this repository's own Actions cache: a cold
# start publishes the first history, the warm run balances from it, a failed shard and the rollback
# switch leave it as it was, and a race makes finish lose its first key to another writer.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The finish phase reads the jobs API to measure the per-shard overhead in its summary.
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, format, unit tests, public check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/consumer/package-lock.json
            qualification/flakiness/package-lock.json

      # The same setup as docs/development.md: the root, the consumer fixture the unit tests list
      # and run with its real Playwright, and the Flakiness package its unit tests run.
      - name: Install dependencies
        run: npm run setup

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Public repo check
        run: npm run check:public

  e2e-cold:
    name: e2e, cold start
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      expect-mode: native
      expect-history: changed

  # Same run id as the cold start, so finish finds the run already in the history and writes nothing.
  e2e-warm:
    name: e2e, warm
    needs: e2e-cold
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      expect-mode: balanced
      expect-history: unchanged

  e2e-failed:
    name: e2e, failed shard
    needs: e2e-warm
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      fail-test: adds an item
      expect-mode: balanced
      expect-finish: failure
      expect-history: unchanged

  e2e-rollback:
    name: e2e, rollback
    needs: e2e-warm
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      enabled: 'false'
      expect-mode: disabled
      expect-history: unchanged

  e2e-race:
    name: e2e, racing writers
    uses: ./.github/workflows/e2e-pipeline.yml
    with:
      history-key: e2e-race-${{ github.run_id }}-${{ github.run_attempt }}
      race: true
      expect-mode: native
      expect-history: race

  # Each harness run is independent and spends most of its time in the fixture's serial sleeps, so
  # the runs are matrix legs that execute in parallel. A leg fails on any violation, and the
  # negative legs also fail when a control does not behave as expected.
  harness:
    name: qualification harness, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native sharding, 2 shards
            id: native-2
            command: npm run harness -- --shards 2 --report harness-report.json
          - name: native sharding, 3 shards
            id: native-3
            command: npm run harness -- --shards 3 --report harness-report.json
          - name: native sharding, 3 shards with repeat-each 2
            id: native-3-repeat
            command: npm run harness -- --shards 3 --repeat-each 2 --report harness-report.json
          - name: native sharding, setup project selected by name
            id: native-setup
            command: npm run harness -- --shards 2 --report harness-report.json -- --project=setup
          - name: native sharding, identity fixture
            id: native-identity
            command: npm run harness -- --shards 2 --config identity.config.js --report harness-report.json
          - name: negative control
            id: negative
            command: npm run harness:negative -- --report harness-report.json
          - name: negative control with repeat-each 2
            id: negative-repeat
            command: npm run harness:negative -- --repeat-each 2 --report harness-report.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json

      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci

      - name: Run the harness
        run: ${{ matrix.command }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ matrix.id }}
          path: harness-report.json
          if-no-files-found: ignore
