# Every gate the repository defines runs here: lint, format, unit tests and the public-repo check.
# The `stub` job runs the action itself, which proves a consuming workflow sees a failed step. It
# checks the outcome only: the not-implemented message is asserted by the unit tests, which execute
# action.yml's run line, so a broken run line cannot hide behind this job's failure check.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, format, unit tests, public check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Public repo check
        run: npm run check:public

  stub:
    name: the action fails when used
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the action
        id: action
        uses: ./
        continue-on-error: true

      - name: Require the failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Expected the stub action to fail, got outcome $OUTCOME." >&2
            exit 1
          fi

  harness:
    name: qualification harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json

      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci

      - name: Native sharding, 2 shards
        run: npm run harness -- --shards 2 --report harness-report-2.json

      - name: Native sharding, 3 shards
        run: npm run harness -- --shards 3 --report harness-report-3.json

      - name: Native sharding, 3 shards with repeat-each 2
        run: npm run harness -- --shards 3 --repeat-each 2 --report harness-report-3-repeat.json

      - name: Negative control
        run: npm run harness:negative -- --report harness-report-negative.json

      - name: Negative control with repeat-each 2
        run: npm run harness:negative -- --repeat-each 2 --report harness-report-negative-repeat.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-reports
          path: harness-report-*.json
          if-no-files-found: ignore
