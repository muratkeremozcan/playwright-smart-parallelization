# One pipeline of the Action on the consumer fixture, the way a consumer wires it: a shard matrix
# whose jobs run the Action and then their own Playwright command with $PSP_ARGS
# (.github/actions/e2e-shard), and the optional finish action in a job of its own. The caller
# sets the scenario and what it expects; the assert job reads the history the shards published
# and the records they uploaded.
#
# `seed` saves a history of a synthetic run 1 under <prefix>1-1 first, so the shards balance from
# it. `warm` adds a second shard job after the first, with no finish between them: it must balance
# from the history the first job's shards published. `rerun` adds one more matrix leg that runs
# shard 2 again once the others have published: it must plan from the same pin, the seeded bytes.
# `barrier` holds every shard after Playwright until one moment, so all post steps publish at once.
# `start-together` starts the shards' Action 300 ms apart, while mover jobs publish a newer history
# entry between each two starts: a shard that misses the pin reads another entry than the shard
# before it, and every shard must still plan from one pinned snapshot. A mover that starts too
# late to save in that window saves nothing, and the post steps wait a minute past it, so no mover
# entry lands among the shards' own publishes. The race gates nothing by its timing, which a runner
# queue or the cache's visibility can blunt: the pin checks below hold whatever the timing, and
# each shard reports in its job summary whether it met its moment and the history moved past its
# pinned entry.
#
# A re-run reuses the history key, which is keyed on the run id only, so a leg that expects to
# publish accepts finding its samples already in the history on a later attempt. Every shard of a
# later attempt plans from the pin of the first, a cache entry that outlives the artifacts a
# re-run of the whole workflow deletes, so it expects the mode of the first attempt, and the
# assert job requires the pin to predate the attempt.
#
# The assert job also holds the network operations each step of the Action made to budgets from
# its code paths (tests/e2e/operations.js), and reports the time each step took in the job summary
# without gating on it: wall-clock time on shared runners varies too much to fail a run on.
name: E2E pipeline

on:
  workflow_call:
    inputs:
      history-key:
        type: string
        required: true
      shards:
        type: number
        default: 3
      shape:
        description: plain, shell or npm, the form of the Playwright command.
        type: string
        default: plain
      working-directory:
        description: The working-directory input of the Action; empty searches from the workspace.
        type: string
        default: fixtures/consumer
      enabled:
        type: string
        default: 'true'
      fail-test:
        description: A title the fixture fails on every attempt, empty for none.
        type: string
        default: ''
      seed:
        type: boolean
        default: false
      warm:
        type: boolean
        default: false
      rerun:
        type: boolean
        default: false
      barrier:
        type: boolean
        default: false
      start-together:
        type: boolean
        default: false
      checkout-head:
        description: Check out the pull request head and export it as GITHUB_SHA, as some workflows do.
        type: boolean
        default: false
      expect-mode:
        type: string
        required: true
      expect-finish:
        type: string
        default: success
      expect-coverage:
        description: The coverage finish outputs, ok, failed or not checked.
        type: string
        default: ok
      expect-history:
        description: published (every passing test has one sample of this run) or unchanged.
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      include: ${{ steps.matrix.outputs.include }}
      barrier: ${{ steps.matrix.outputs.barrier }}
      start: ${{ steps.matrix.outputs.start }}
      key: ${{ steps.key.outputs.key }}
      key12: ${{ steps.key.outputs.key12 }}
      prefix: ${{ steps.key.outputs.prefix }}
      pin: ${{ steps.key.outputs.pin }}
      seed-sha: ${{ steps.seed.outputs.sha }}
      before: ${{ steps.before.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: matrix
        env:
          TOTAL: ${{ inputs.shards }}
          RERUN: ${{ inputs.rerun }}
          BARRIER: ${{ inputs.barrier }}
          START: ${{ inputs.start-together }}
        run: |
          echo "shards=$(seq -s, 1 "$TOTAL" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
          if [ "$RERUN" = true ]; then echo 'include=[{"shard":2,"rerun":true}]' >> "$GITHUB_OUTPUT"; else echo 'include=[]' >> "$GITHUB_OUTPUT"; fi
          # Room for every shard runner to start, install and run its tests first.
          if [ "$BARRIER" = true ]; then echo "barrier=$(( $(date +%s) + 240 ))" >> "$GITHUB_OUTPUT"; fi
          # Room for every shard and mover runner to start and install first.
          if [ "$START" = true ]; then
            start=$(( $(date +%s) + 150 ))
            echo "start=$start" >> "$GITHUB_OUTPUT"
            echo "barrier=$(( start + 60 ))" >> "$GITHUB_OUTPUT"
          fi
      - id: key
        env:
          INPUT_WORKING-DIRECTORY: ${{ inputs.working-directory }}
          INPUT_HISTORY-KEY: ${{ inputs.history-key }}
          JOB: test
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node tests/e2e/history.js key >> "$GITHUB_OUTPUT"
      - id: seed
        if: inputs.seed && github.run_attempt == 1
        run: node tests/e2e/history.js seed "${{ steps.key.outputs.key }}" 1 >> "$GITHUB_OUTPUT"
      - if: inputs.seed && github.run_attempt == 1
        uses: actions/cache/save@v6
        with:
          path: .psp/history
          key: ${{ steps.key.outputs.prefix }}1-1
      - id: before
        uses: actions/cache/restore@v6
        with:
          path: .psp/history
          key: ${{ steps.key.outputs.prefix }}
          restore-keys: ${{ steps.key.outputs.prefix }}
          lookup-only: true

  # Other runs publishing while the shards pin: mover k saves a newer entry of the history between
  # the starts of shard k and shard k + 1, a save taking about 300 ms.
  mover:
    needs: setup
    if: inputs.start-together
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mover: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          KEY: ${{ needs.setup.outputs.key }}
          MOVER: ${{ matrix.mover }}
        run: node tests/e2e/history.js seed "$KEY" "$((1000 + MOVER))"
      - name: Wait for this mover's moment
        id: moment
        env:
          AT: ${{ needs.setup.outputs.start }}
          MOVER: ${{ matrix.mover }}
        run: node tests/e2e/history.js wait-until "$AT" "$(( (MOVER - 1) * 300 - 150 ))" >> "$GITHUB_OUTPUT"
      - if: steps.moment.outputs.late != 'true'
        uses: actions/cache/save@v6
        with:
          path: .psp/history
          key: ${{ needs.setup.outputs.prefix }}1-${{ matrix.mover }}0

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
        rerun: [false]
        include: ${{ fromJSON(needs.setup.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-head && github.event.pull_request.head.sha || '' }}
      - if: inputs.checkout-head
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "GITHUB_SHA=$HEAD" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json
      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci
      # A re-run of shard 2: it starts once the other shards published, so the newest history is
      # no longer the one the run pinned.
      - name: Wait for the other shards to publish
        if: matrix.rerun
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ needs.setup.outputs.prefix }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 60); do
            n=$(gh api "repos/$REPO/actions/caches?key=$PREFIX&per_page=100" --jq '.total_count')
            [ "$n" -gt 1 ] && { echo "$n history entries"; exit 0; }
            sleep 10
          done
          echo "::error::the other shards published nothing in 10 minutes"; exit 1
      - uses: ./.github/actions/e2e-shard
        with:
          shard: ${{ matrix.shard }}
          total: ${{ inputs.shards }}
          shape: ${{ inputs.shape }}
          working-directory: ${{ inputs.working-directory }}
          history-key: ${{ inputs.history-key }}
          enabled: ${{ inputs.enabled }}
          fail-test: ${{ inputs.fail-test }}
          # A re-run reads the pin of the first attempt, so it expects the same mode.
          expect-mode: ${{ inputs.expect-mode }}
          expect-sha: ${{ matrix.rerun && needs.setup.outputs.seed-sha || '' }}
          barrier: ${{ needs.setup.outputs.barrier }}
          start: ${{ needs.setup.outputs.start }}
          history-prefix: ${{ needs.setup.outputs.prefix }}

  # The next run of the same history, with no finish job before it.
  warm:
    needs: [setup, test]
    if: ${{ !cancelled() && inputs.warm }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/consumer/package-lock.json
      - name: Install the consumer fixture
        working-directory: fixtures/consumer
        run: npm ci
      - uses: ./.github/actions/e2e-shard
        with:
          shard: ${{ matrix.shard }}
          total: '4'
          working-directory: ${{ inputs.working-directory }}
          history-key: ${{ inputs.history-key }}
          expect-mode: balanced

  # Gated the way a consumer gates it: finish runs whatever the shards did.
  finish:
    needs: [setup, test, warm]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: finish
        uses: ./finish
        continue-on-error: true
        with:
          history-key: ${{ inputs.history-key }}
      - name: Require the finish outcome and outputs
        env:
          OUTCOME: ${{ steps.finish.outcome }}
          MODE: ${{ steps.finish.outputs.mode }}
          COVERAGE: ${{ steps.finish.outputs.coverage }}
          OVERHEAD: ${{ steps.finish.outputs.overhead-ms }}
          EXPECTED: ${{ inputs.expect-finish }}
          EXPECTED_COVERAGE: ${{ inputs.expect-coverage }}
        run: |
          echo "finish ended $OUTCOME: mode $MODE, coverage $COVERAGE, overhead ${OVERHEAD:-none} ms"
          fail() { echo "::error::$1"; exit 1; }
          [ "$OUTCOME" = "$EXPECTED" ] || fail "finish ended $OUTCOME, expected $EXPECTED"
          [ "$COVERAGE" = "$EXPECTED_COVERAGE" ] || fail "coverage $COVERAGE, expected $EXPECTED_COVERAGE"
          # The jobs API is readable with actions: read, so a checked run measures its overhead.
          if [ "$EXPECTED_COVERAGE" = ok ]; then
            [ -n "$OVERHEAD" ] || fail "the per-shard overhead was not measured"
          fi

  assert:
    needs: [setup, test, warm, finish]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every shard job to have passed
        env:
          TEST: ${{ needs.test.result }}
          WARM: ${{ needs.warm.result }}
        run: |
          [ "$TEST" = success ] || { echo "::error::the shard jobs ended $TEST"; exit 1; }
          [ "$WARM" = success ] || [ "$WARM" = skipped ] || { echo "::error::the warm jobs ended $WARM"; exit 1; }
      - id: after
        uses: actions/cache/restore@v6
        with:
          path: .psp/history
          key: ${{ needs.setup.outputs.prefix }}
          restore-keys: ${{ needs.setup.outputs.prefix }}
      - id: pin
        uses: actions/cache/restore@v6
        with:
          path: .psp/pin
          key: ${{ needs.setup.outputs.pin }}
      - name: Require a later attempt to plan from the pin of an earlier one
        if: github.run_attempt > 1 && steps.pin.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.setup.outputs.pin }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          created=$(gh api "repos/$REPO/actions/caches?key=$NAME" --jq ".actions_caches[] | select(.key == \"$NAME\") | .created_at")
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          echo "the pin was created $created, this attempt started $started"
          [ "$(date -d "$created" +%s%N)" -lt "$(date -d "$started" +%s%N)" ] || { echo "::error::the pin was created in this attempt"; exit 1; }
      # One at a time, so an artifact of an earlier attempt that a re-run of the whole workflow
      # deleted, which the listings still return for minutes and fail to download, is skipped,
      # while a record of this attempt that fails to download fails the job.
      - name: Download the records
        env:
          GH_TOKEN: ${{ github.token }}
          KEY12: ${{ needs.setup.outputs.key12 }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p records
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"psp-record-\") and contains(\"-$KEY12-\")) | \"\(.id) \(.name)\"" |
            while read -r id name; do
              if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/a.zip" && unzip -q -o "$RUNNER_TEMP/a.zip" -d "records/$name-$id"; then
                echo "downloaded $name"
              else
                case "$name" in
                  *-attempt-"$ATTEMPT") echo "::error::the record $name of this attempt could not be downloaded"; exit 1 ;;
                  *) echo "skipped $name, an earlier attempt's artifact that is gone" ;;
                esac
              fi
            done
      - name: Require the history and the records
        env:
          BEFORE: ${{ needs.setup.outputs.before }}
          AFTER: ${{ steps.after.outputs.cache-matched-key }}
          PINNED: ${{ steps.pin.outputs.cache-hit }}
          EXPECTED: ${{ inputs.expect-history }}
          ENABLED: ${{ inputs.enabled }}
          FAIL_TEST: ${{ inputs.fail-test }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          BARRIER: ${{ inputs.barrier }}
          PREFIX: ${{ needs.setup.outputs.prefix }}
        run: |
          echo "newest entry before: ${BEFORE:-none}, after: ${AFTER:-none}, pinned: ${PINNED:-false}"
          fail() { echo "::error::$1"; exit 1; }
          if [ "$ENABLED" = false ]; then
            [ "$PINNED" != true ] || fail "rollback pinned a snapshot"
            [ -z "$(ls records 2>/dev/null | grep -v disabled)" ] || fail "rollback left run records"
          fi
          if [ -n "$FAIL_TEST" ]; then
            grep -rqs '"status":"failed"' records || fail "no shard recorded the failing test"
          fi
          if [ "$ENABLED" != false ]; then
            [ "$PINNED" = true ] || fail "no pin was saved"
            node tests/e2e/history.js expect-pin "$RUN_ID" records
          fi
          case "$EXPECTED" in
            unchanged) [ "$AFTER" = "$BEFORE" ] || fail "the history changed" ;;
            published)
              [ -n "$AFTER" ] || fail "nothing was published"
              if [ "$ATTEMPT" = 1 ] && [ "$AFTER" = "$BEFORE" ]; then fail "nothing was published"; fi
              node tests/e2e/history.js expect-samples "$RUN_ID" records "$FAIL_TEST"
              # Eight shards at once, cold: one entry per shard that had a passing test.
              if [ "$BARRIER" = true ] && [ "$ATTEMPT" = 1 ]; then
                n=$(node tests/e2e/history.js publishers "$RUN_ID" records)
                case "$AFTER" in "$PREFIX"*-"$n") ;; *) fail "expected the entry $n of a fresh chain, got $AFTER" ;; esac
              fi ;;
            *) fail "unknown expectation $EXPECTED" ;;
          esac
      - name: Hold the Action's network operations to their budgets, and report its step times
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ inputs.shards }}
          ENABLED: ${{ inputs.enabled }}
        run: node tests/e2e/operations.js "$SHARDS" "$ENABLED"
