# One shard of the end-to-end pipeline, the way a consumer writes it: the Action from this
# checkout, then the consumer's own Playwright command with $PSP_ARGS, in one of the shapes users
# write. The steps of a consumer's job, plus the checks of what the main step decided. Its post step
# runs at the end of the job; the pipeline's assert job checks what it published.
name: e2e shard
description: One shard of the e2e pipeline.

inputs:
  shard:
    required: true
  total:
    required: true
  shape:
    description: plain, shell (shell variables and --grep "$FILTER") or npm (an npm script)
    default: plain
  working-directory:
    description: The working-directory input of the Action; empty leaves it at its default.
    default: ''
  history-key:
    required: true
  pnp:
    description: true adds a Yarn Plug'n'Play loader to the fixture, which disables the Action.
    default: 'false'
  playwright-args:
    description: Arguments the Playwright command adds, such as --workers=3 or --config=FILE.
    default: ''
  expect-workers:
    description: The worker count Playwright must resolve, as the run record names it; empty for any.
    default: ''
  expect-plan-workers:
    description: The worker count a balanced shard must plan for; empty for any.
    default: ''
  fail-test:
    description: A title the fixture fails on every attempt, empty for none.
    default: ''
  expect-mode:
    required: true
  expect-sha:
    description: The snapshot sha the shard must plan from, empty for any.
    default: ''
  barrier:
    description: A Unix time to wait for after Playwright, so every post step starts at once.
    default: ''
  start:
    description: A Unix time; shard k starts the Action (k - 1) * 300 ms after it.
    default: ''
  history-prefix:
    description: The cache prefix of the history, for the report of a start-together shard.
    default: ''

runs:
  using: composite
  steps:
    - name: Wait for this shard's moment, so the main steps pin together
      id: moment
      if: inputs.start != ''
      shell: bash
      env:
        AT: ${{ inputs.start }}
        SHARD: ${{ inputs.shard }}
      run: node tests/e2e/history.js wait-until "$AT" "$(( (SHARD - 1) * 300 ))" >> "$GITHUB_OUTPUT"

    - name: Add a Yarn Plug'n'Play loader, which disables the Action
      if: inputs.pnp == 'true'
      shell: bash
      run: touch fixtures/consumer/.pnp.cjs

    - id: psp
      uses: ./
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        history-key: ${{ inputs.history-key }}
        # The pull requests of this repository publish into their own cache scope.
        publish-history: 'true'

    - name: Require the decision of the main step
      shell: bash
      env:
        MODE: ${{ steps.psp.outputs.mode }}
        EXPECTED: ${{ inputs.expect-mode }}
        EXPECTED_SHA: ${{ inputs.expect-sha }}
        ARGS: ${{ steps.psp.outputs.args }}
      run: |
        fail() { echo "::error::$1"; exit 1; }
        echo "mode $MODE, PSP_ARGS '$PSP_ARGS', snapshot ${PSP_SNAPSHOT_SHA:-none}"
        [ "$MODE" = "$EXPECTED" ] || fail "the main step chose $MODE, expected $EXPECTED"
        [ "$ARGS" = "$PSP_ARGS" ] || fail "the args output differs from PSP_ARGS"
        if [ "$MODE" = disabled ]; then
          [ -z "$PSP_ARGS" ] || fail "a disabled shard exported PSP_ARGS '$PSP_ARGS'"
        else
          case "$PSP_ARGS" in --add-reporter=/*reporter.js) ;; *) fail "PSP_ARGS is '$PSP_ARGS'" ;; esac
        fi
        if [ -n "$EXPECTED_SHA" ] && [ "$PSP_SNAPSHOT_SHA" != "$EXPECTED_SHA" ]; then
          fail "the shard planned from ${PSP_SNAPSHOT_SHA:-no snapshot}, expected $EXPECTED_SHA"
        fi

    # How hard the race was, for the job summary: the gates are the pin checks of the assert job,
    # which hold whatever the timing; this shows whether this shard met its moment and whether the
    # history had moved past the pinned entry by the end of its main step.
    - id: newest
      if: inputs.start != ''
      uses: actions/cache/restore@v6
      with:
        path: .psp/history
        key: ${{ inputs.history-prefix }}
        restore-keys: ${{ inputs.history-prefix }}
        lookup-only: true
    - name: Report the race this shard ran in
      if: inputs.start != ''
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
        LATE: ${{ steps.moment.outputs.late }}
        PLANNED: ${{ steps.psp.outputs.reason }}
        NEWEST: ${{ steps.newest.outputs.cache-matched-key }}
      run: |
        line="shard $SHARD $([ "$LATE" = true ] && echo 'missed its moment' || echo 'met its moment'): planned from $PLANNED; newest entry after its main step: ${NEWEST:-none}"
        echo "$line"
        echo "- $line" >> "$GITHUB_STEP_SUMMARY"

    - id: plain
      if: inputs.shape == 'plain'
      continue-on-error: true
      shell: bash
      working-directory: fixtures/consumer
      env:
        PSP_FIXTURE_FAIL: ${{ inputs.fail-test }}
        PW_ARGS: ${{ inputs.playwright-args }}
      run: npx playwright test --project=chromium --grep-invert=oversized --shard=${{ inputs.shard }}/${{ inputs.total }} $PW_ARGS $PSP_ARGS 2>&1 | tee "$RUNNER_TEMP/playwright.log"

    - id: shell
      if: inputs.shape == 'shell'
      continue-on-error: true
      shell: bash
      working-directory: fixtures/consumer
      env:
        PSP_FIXTURE_FAIL: ${{ inputs.fail-test }}
        SHARD: ${{ inputs.shard }}/${{ inputs.total }}
        PW_ARGS: ${{ inputs.playwright-args }}
      run: |
        SUITES="tests/cart.spec.js tests/catalog.spec.js tests/checkout.spec.js"
        FILTER="item|catalog|checkout"
        npx playwright test $SUITES --project=chromium --grep "$FILTER" --shard=$SHARD $PW_ARGS $PSP_ARGS 2>&1 | tee "$RUNNER_TEMP/playwright.log"

    - id: npm
      if: inputs.shape == 'npm'
      continue-on-error: true
      shell: bash
      working-directory: fixtures/consumer
      env:
        PSP_FIXTURE_FAIL: ${{ inputs.fail-test }}
        PW_ARGS: ${{ inputs.playwright-args }}
      run: npm run test:pw -- --project=chromium --grep-invert=oversized --shard=${{ inputs.shard }}/${{ inputs.total }} $PW_ARGS $PSP_ARGS 2>&1 | tee "$RUNNER_TEMP/playwright.log"

    - name: Require the outcome of the Playwright step
      shell: bash
      env:
        OUTCOME: ${{ inputs.shape == 'npm' && steps.npm.outcome || inputs.shape == 'shell' && steps.shell.outcome || steps.plain.outcome }}
        FAIL_TEST: ${{ inputs.fail-test }}
      run: |
        echo "the Playwright step ended $OUTCOME"
        # A failing test fails only the shards that ran it; the assert job checks that one did.
        if [ -z "$FAIL_TEST" ] && [ "$OUTCOME" != success ]; then
          echo "::error::the Playwright step ended $OUTCOME"
          exit 1
        fi

    # The workers are Playwright's: the record names the count it resolved, and a balanced shard
    # plans for the count of its pinned snapshot, naming its own when the two differ.
    - name: Require the workers Playwright resolved and the plan packed for
      if: inputs.expect-workers != '' || inputs.expect-plan-workers != ''
      shell: bash
      env:
        WORKERS: ${{ inputs.expect-workers }}
        PLANNED: ${{ inputs.expect-plan-workers }}
        MODE: ${{ steps.psp.outputs.mode }}
      run: |
        fail() { echo "::error::$1"; exit 1; }
        log="$RUNNER_TEMP/playwright.log"
        resolved=$(jq -r .workers "$PSP_RECORD")
        echo "Playwright resolved $resolved worker(s)"
        if [ -n "$WORKERS" ]; then
          [ "$resolved" = "$WORKERS" ] || fail "Playwright resolved $resolved worker(s), expected $WORKERS"
        fi
        if [ -n "$PLANNED" ] && [ "$MODE" = balanced ]; then
          grep -q "planned for $PLANNED worker(s)" "$log" || fail "the plan did not pack for $PLANNED worker(s)"
          if [ "$resolved" != "$PLANNED" ]; then
            grep -q "Playwright resolved $resolved worker(s), the pinned snapshot $PLANNED" "$log" || fail "the shard did not name its other count"
          else
            ! grep -q "Playwright resolved" "$log" || fail "the shard named another count, though the counts agree"
          fi
        fi

    - name: Wait for every shard, so the post steps publish at once
      if: inputs.barrier != ''
      shell: bash
      env:
        AT: ${{ inputs.barrier }}
      run: |
        now=$(date +%s)
        if [ "$now" -lt "$AT" ]; then sleep $((AT - now)); else echo "::warning::the barrier passed $((now - AT))s ago"; fi
