name: 'Playwright Smart Parallelization'
description: 'Duration-balanced Playwright sharding: one step before your own Playwright command, which adds $PSP_ARGS.'
author: muratkeremozcan
branding:
  icon: 'zap'
  color: 'green'

inputs:
  working-directory:
    description: 'The directory of the Playwright project, relative to the workspace, where its Playwright version is read. Set it only when the workspace holds projects on several Playwright versions; empty searches from the workspace.'
    required: false
    default: '.'
  history-key:
    description: 'Any extra text that separates one sharded suite from another in one run, such as a matrix leg next to the shard or an environment name.'
    required: false
    default: ''
  publish-history:
    description: |
      auto publishes each shard's samples from the repository's default branch only; true also from
      same-repository branches and pull requests, which write into their own cache scope, for a
      repository that runs its suite only on pull requests. Fork pull requests and
      pull_request_target never publish.
    required: false
    default: 'auto'
  github-token:
    description: 'Reads the age of the run from the runs API, only when a re-run finds neither its pin nor a record that kept it, and artifacts are kept under 30 days.'
    required: false
    default: ${{ github.token }}

outputs:
  mode:
    description: 'balanced, native or disabled.'
  reason:
    description: 'Why the shard has that mode.'
  args:
    description: 'The arguments in PSP_ARGS.'

runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
  post-if: always()
